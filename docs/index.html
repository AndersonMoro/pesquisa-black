<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>Pesquisa Black</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #14171a; --mute: #646b74; --line: #e3e6ea;
    --good: #0a7d44; --good-bg: #e2f5ea; --bad: #b3261e; --bad-bg: #fde8e6;
    --warn: #8a5a00; --warn-bg: #fff1cc; --neutral-bg: #eceef1; --accent: #2456d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --card: #181b20; --ink: #eef0f3; --mute: #9aa2ad; --line: #2a2f37;
      --good: #5fd394; --good-bg: #12301f; --bad: #ff8a80; --bad-bg: #3a1614;
      --warn: #ffcc66; --warn-bg: #3a2c08; --neutral-bg: #252a31; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 1.5rem; margin: 0 0 2px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--mute); font-size: .875rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-top: 16px; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .top img { width: 56px; height: 56px; object-fit: contain; border-radius: 8px;
    background: #fff; flex: none; }
  .top h2 { font-size: 1rem; margin: 0; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; }
  .price b { font-size: 1.75rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .price span { color: var(--mute); font-size: .875rem; }
  .badge { display: inline-block; margin-top: 10px; padding: 4px 10px; border-radius: 999px;
    font-size: .8125rem; font-weight: 600; background: var(--neutral-bg); color: var(--ink); }
  .otimo, .bom { background: var(--good-bg); color: var(--good); }
  .caro { background: var(--bad-bg); color: var(--bad); }
  .maquiado { background: var(--warn-bg); color: var(--warn); }
  .why { margin: 8px 0 0; font-size: .9rem; color: var(--mute); }
  .chart { position: relative; margin-top: 14px; touch-action: pan-y; }
  svg { display: block; width: 100%; height: 130px; overflow: visible; }
  .tip { position: absolute; top: -6px; transform: translateX(-50%); pointer-events: none;
    background: var(--ink); color: var(--bg); font-size: .75rem; padding: 3px 8px;
    border-radius: 6px; white-space: nowrap; display: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
    border-top: 1px solid var(--line); padding-top: 12px; }
  .stats div { font-size: .75rem; color: var(--mute); }
  .stats b { display: block; font-size: .95rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: .875rem; }
  a { color: var(--accent); }
  .target { color: var(--mute); }
  .target.hit { color: var(--good); font-weight: 600; }
  .err { border-color: var(--bad); font-size: .9rem; }
  .note { color: var(--mute); font-size: .8125rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pesquisa Black</h1>
    <p id="quando">Carregando…</p>
  </header>
  <div id="lista"></div>
  <p class="note">Preço = menor oferta do dia entre as lojas, segundo o Zoom. “Preço normal” é a
    mediana dos últimos 30 dias. Um desconto só é tratado como real quando fica abaixo disso;
    se o preço subiu nos últimos dias e depois “baixou”, aparece como desconto maquiado.</p>
</main>
<script>
const brl = v => v == null ? "–" : v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const dia = d => d.slice(8, 10) + "/" + d.slice(5, 7);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function grafico(serie, mediana) {
  const W = 600, H = 130, pad = 6;
  const ps = serie.map(p => p[1]);
  let lo = Math.min(...ps, mediana ?? Infinity), hi = Math.max(...ps, mediana ?? -Infinity);
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => serie.length < 2 ? W / 2 : i / (serie.length - 1) * W;
  const y = v => pad + (1 - (v - lo) / (hi - lo)) * (H - 2 * pad);
  const pts = serie.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ");
  const iMin = ps.indexOf(Math.min(...ps)), n = serie.length - 1;
  const med = mediana == null ? "" :
    `<line x1="0" x2="${W}" y1="${y(mediana)}" y2="${y(mediana)}" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Histórico de preços">
    ${med}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <line class="cur" y1="0" y2="${H}" stroke="var(--mute)" stroke-width="1" vector-effect="non-scaling-stroke" visibility="hidden"/>
  </svg>
  <span class="dot" style="left:${x(iMin) / W * 100}%;top:${y(ps[iMin])}px;background:var(--good)"></span>
  <span class="dot" style="left:${x(n) / W * 100}%;top:${y(ps[n])}px;background:var(--accent)"></span>
  <span class="tip"></span>`;
}

function ligarToque(el, serie) {
  const tip = el.querySelector(".tip"), cur = el.querySelector(".cur");
  const mover = e => {
    const r = el.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const i = Math.round(f * (serie.length - 1));
    const px = serie.length < 2 ? 50 : i / (serie.length - 1) * 100;
    tip.textContent = `${dia(serie[i][0])} · ${brl(serie[i][1])}`;
    tip.style.left = Math.min(88, Math.max(12, px)) + "%";
    tip.style.display = "block";
    cur.setAttribute("x1", px * 6); cur.setAttribute("x2", px * 6);
    cur.setAttribute("visibility", "visible");
  };
  el.addEventListener("pointermove", mover);
  el.addEventListener("pointerdown", mover);
  el.addEventListener("pointerleave", () => { tip.style.display = "none"; cur.setAttribute("visibility", "hidden"); });
}

function cartao(p) {
  const a = p.analise;
  // a série guarda o menor preço de cada dia; se agora está diferente, mostra o ponto atual
  const ult = p.serie[p.serie.length - 1];
  if (ult && ult[1] !== p.preco) p.serie.push([ult[0], p.preco]);
  const alvo = p.alvo ? `<span class="target ${p.preco <= p.alvo ? "hit" : ""}">Alvo: ${brl(p.alvo)}${p.preco <= p.alvo ? " ✓ atingido" : ""}</span>` : "<span></span>";
  const dif = a.dif_mediana == null ? "" : ` · ${a.dif_mediana > 0 ? "+" : ""}${a.dif_mediana.toLocaleString("pt-BR")}% vs normal`;
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `
    <div class="top">
      ${p.imagem ? `<img src="${esc(p.imagem)}" alt="" loading="lazy">` : ""}
      <h2>${esc(p.nome)}</h2>
    </div>
    <div class="price"><b>${brl(p.preco)}</b><span>${esc(p.loja)} · ${p.n_lojas} loja(s)${dif}</span></div>
    <span class="badge ${a.veredito}">${esc(a.titulo)}</span>
    <p class="why">${esc(a.explicacao)}</p>
    <div class="chart">${grafico(p.serie, a.mediana)}</div>
    <div class="stats">
      <div>Mínimo${a.minimo_data ? " (" + dia(a.minimo_data) + ")" : ""}<b>${brl(a.minimo)}</b></div>
      <div>Normal (mediana)<b>${brl(a.mediana)}</b></div>
      <div>Máximo<b>${brl(a.maximo)}</b></div>
    </div>
    <div class="foot">${alvo}<a href="${esc(p.url)}" target="_blank" rel="noopener">Ver no Zoom →</a></div>`;
  ligarToque(el.querySelector(".chart"), p.serie);
  return el;
}

const estilo = document.createElement("style");
estilo.textContent = ".dot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card);pointer-events:none}";
document.head.append(estilo);

fetch("dados/resumo.json?t=" + Date.now()).then(r => r.json()).then(d => {
  const q = new Date(d.atualizado);
  document.getElementById("quando").textContent =
    "Atualizado em " + q.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + " · Fonte: " + d.fonte;
  const lista = document.getElementById("lista");
  const ordem = { maquiado: 0, otimo: 1, bom: 2, caro: 3, normal: 4, curto: 5 };
  d.produtos.sort((a, b) => ordem[a.analise.veredito] - ordem[b.analise.veredito]).forEach(p => lista.append(cartao(p)));
  d.erros.forEach(e => {
    const el = document.createElement("section");
    el.className = "card err";
    el.innerHTML = `<b>${esc(e.entrada)}</b><br>Sem leitura: ${esc(e.erro)}`;
    lista.append(el);
  });
  if (!d.produtos.length && !d.erros.length) lista.innerHTML = '<p class="card">Nenhum produto na lista ainda. Edite o arquivo produtos.txt no repositório.</p>';
}).catch(() => { document.getElementById("quando").textContent = "Ainda não há dados coletados."; });
</script>
</body>
</html>
