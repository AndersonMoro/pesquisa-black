name: Coleta de preços

on:
  schedule:
    - cron: "7,27,47 * * * *"   # a cada 20 min: o GitHub pula muitas execuções, assim sobra margem
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
  push:
    paths: [produtos.txt]      # roda ao editar a lista de produtos

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # sempre a versão mais nova da lista, não a do disparo
      - name: Coletar preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 coletor.py   # o Python que já vem na máquina (instalar outro custava tempo)
      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "coletor-de-precos"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet && exit 0
          git commit -m "Coleta de preços $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          # se o repositório mudou durante a coleta, reaplica por cima (vale o dado mais novo)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
