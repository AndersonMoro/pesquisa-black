name: Coleta de preços

on:
  schedule:
    - cron: "17 */2 * * *"   # a cada 2 horas
  workflow_dispatch:           # botão "Run workflow" para rodar na hora
  push:
    paths: [produtos.txt]      # roda ao editar a lista de produtos

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar preços
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python coletor.py
      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "coletor-de-precos"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet && exit 0
          git commit -m "Coleta de preços $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase
          git push
